name: Release
'on':
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_TITLE: ${{ github.event.pull_request.title || 'Manual release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Check if release needed
        id: skip_check
        run: |
          if git describe --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged - skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine version bump
        if: steps.skip_check.outputs.skip != 'true'
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name || '') }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine release version
        if: steps.skip_check.outputs.skip != 'true'
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          LATEST_TAG=$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:lstrip=2)' 'refs/tags/v*.*.*')
          LATEST=${LATEST_TAG#v}
          CURRENT=$(node -p "require('./package.json').version")
          NEWEST=$(printf '%s\n' "$LATEST" "$CURRENT" | sort -V | tail -n 1)

          if [ "$CURRENT" = "$NEWEST" ] && ! git rev-parse -q --verify "refs/tags/v${CURRENT}" >/dev/null; then
            echo "package.json v${CURRENT} is newer than every tag - using it as-is"
          else
            echo "Latest tag is v${LATEST} - bumping ${BUMP_TYPE}"
            npm version "$LATEST" --no-git-tag-version --allow-same-version
            npm version "$BUMP_TYPE" --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag will be ${TAG}"
      - name: Type check
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm typecheck
      - name: Run tests
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm test
      - name: Build
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm build
      - name: Build release notes from commits
        if: steps.skip_check.outputs.skip != 'true'
        id: notes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "## What Changed"
            echo ""
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "**PR:** [#${PR_NUMBER} - ${RELEASE_TITLE}](${PR_URL})"
            else
              echo "**Manual release triggered via workflow_dispatch**"
            fi
            echo "**Bump:** \`${BUMP_TYPE}\`"
            echo ""
            echo "### Commits"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        if: steps.skip_check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release ${TAG} - ${RELEASE_TITLE}"
          git push origin "refs/tags/${TAG}"
      - name: Create GitHub Release
        if: steps.skip_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} - ${{ env.RELEASE_TITLE }}
          body: ${{ steps.notes.outputs.body }}
      - name: Start npm publish
        if: steps.skip_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --ref "$TAG"
    timeout-minutes: 15

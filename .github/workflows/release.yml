name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if release needed
        id: skip_check
        run: |
          if git describe --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged - skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get release description
        if: steps.skip_check.outputs.skip != 'true'
        id: desc
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "title=${{ github.event.pull_request.title }}" >> "$GITHUB_OUTPUT"
          else
            echo "title=Manual release" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump
        if: steps.skip_check.outputs.skip != 'true'
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name || '') }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      # The version lives in the tag, not in a commit: main is protected (CI Gate is
      # required), so this job cannot push a version-bump commit to it.
      - name: Determine release version
        if: steps.skip_check.outputs.skip != 'true'
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          LATEST=${LATEST_TAG#v}
          CURRENT=$(node -p "require('./package.json').version")
          NEWEST=$(printf '%s\n' "$LATEST" "$CURRENT" | sort -V | tail -n 1)

          if [ "$CURRENT" = "$NEWEST" ] && ! git rev-parse -q --verify "refs/tags/v${CURRENT}" >/dev/null; then
            echo "package.json v${CURRENT} is newer than every tag - using it as-is"
          else
            echo "Latest tag is v${LATEST} - bumping ${BUMP_TYPE}"
            npm version "$LATEST" --no-git-tag-version --allow-same-version
            npm version "$BUMP_TYPE" --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag will be ${TAG}"

      - name: Type check
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm typecheck

      - name: Run tests
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm test

      - name: Build
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm build

      - name: Build release notes from commits
        if: steps.skip_check.outputs.skip != 'true'
        id: notes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "## What Changed"
            echo ""
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "**PR:** [#${PR_NUMBER} - ${PR_TITLE}](${PR_URL})"
            else
              echo "**Manual release triggered via workflow_dispatch**"
            fi
            echo "**Bump:** \`${BUMP_TYPE}\`"
            echo ""
            echo "### Commits"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.skip_check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.desc.outputs.title }}
        run: |
          git tag -a "$TAG" -m "Release ${TAG} - ${TITLE}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        if: steps.skip_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} - ${{ steps.desc.outputs.title }}
          body: ${{ steps.notes.outputs.body }}

      # npm trusted publishing is bound to publish.yml, so the publish runs there.
      # A tag pushed with GITHUB_TOKEN fires no push event; workflow_dispatch is allowed.
      - name: Start npm publish
        if: steps.skip_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --ref "$TAG"

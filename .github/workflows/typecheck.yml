name: Typecheck
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Type check (src)
        run: pnpm typecheck
      - name: Type check (mcp-apps)
        run: pnpm typecheck:mcp-apps
    timeout-minutes: 15

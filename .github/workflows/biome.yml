name: Biome
'on':
  workflow_call:
    inputs:
      since:
        description: Base commit to compare against. Empty runs everything.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  biome:
    name: Lint & format (biome ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Lint & format (biome ci)
        if: inputs.since == ''
        run: pnpm check:ci
      - name: Lint & format changed files (biome ci)
        if: inputs.since != ''
        env:
          SINCE: ${{ inputs.since }}
        run: pnpm exec biome ci --changed --since="$SINCE" --no-errors-on-unmatched
    timeout-minutes: 15

name: Publish Package

# Publishes ebay-mcp to npm via OIDC trusted publishing (no NPM_TOKEN).
# The workflow filename `publish.yml` must stay aligned with the npm Trusted Publisher
# configuration for the `ebay-mcp` package (changing the filename invalidates the OIDC match).
#
# Runs only on a release tag and builds exactly that tag:
#   - workflow_dispatch on a tag: started by release.yml after it pushes the tag, or by
#     hand to retry a release: `gh workflow run publish.yml --ref v1.2.3`
#   - push of a v*.*.* tag by a maintainer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify npm supports OIDC Trusted Publishing
        run: |
          test "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -1)" = "11.5.1" || {
            echo "::error::npm $(npm -v) is below 11.5.1; trusted publishing is not supported"
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm (trusted publishing)
        run: pnpm publish --no-git-checks --access public --provenance

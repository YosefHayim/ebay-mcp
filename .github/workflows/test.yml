name: Test
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run integration tests
        run: pnpm test:integration
      - name: Run unit tests with informational coverage
        run: pnpm exec vitest run --coverage.enabled --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
    timeout-minutes: 20
